[package]
name = "pmdb-recorder-macros"
version = "0.1.0"
description = "Procedural macros of pmdb-recorder"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
