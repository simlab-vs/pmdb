[site]
title = Hidden site-b
base_url = https://docs.tide.example/
language = en
default_template = page

[build]
plugins = abbr, editlink, excerpt, extlinks, footnotes, heading-ids, headingshift, highlight, lead, readingtime, search, smartypants, tagaliases, tags, toc

[plugin:toc]
min_level = 2
max_level = 3

[plugin:abbr]
api = Application Programming Interface
cli = Command-Line Interface
tls = Transport Layer Security

[plugin:editlink]
repository = https://git.example.org/tide/docs
branch = main
path = content

[plugin:excerpt]
length = 160

[plugin:tagaliases]
performance = tuning
api = http-api
